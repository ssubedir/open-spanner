info:
  contact: {}
  description: Open source metering service for tracking who used what, when, how
    much, and in what context.
  title: Open Spanner API
  version: 0.1.3
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "204":
          description: No Content
      summary: Health check
      tags:
      - health
  /ready:
    get:
      operationId: readinessCheck
      responses:
        "204":
          description: No Content
        "503":
          description: Service Unavailable
      summary: Readiness check
      tags:
      - health
  /v1/alerts:
    get:
      operationId: listAlertRules
      parameters:
      - description: Meter name
        in: query
        name: meter
        type: string
      - description: Enabled filter
        in: query
        name: enabled
        type: boolean
      - description: Result limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_metering_adapters_http_alert.RuleListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
      summary: List alert rules
      tags:
      - alerts
    post:
      consumes:
      - application/json
      operationId: createAlertRule
      parameters:
      - description: Alert rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_metering_adapters_http_alert.SaveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_metering_adapters_http_alert.RuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
      summary: Create alert rule
      tags:
      - alerts
  /v1/alerts/{id}:
    delete:
      operationId: deleteAlertRule
      parameters:
      - description: Alert rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
      summary: Delete alert rule
      tags:
      - alerts
    get:
      operationId: getAlertRule
      parameters:
      - description: Alert rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_metering_adapters_http_alert.RuleResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ssubedir_open-spanner_internal_metering_adapters_http_internal_respond.ErrorResponse'
      summary: Get alert rule
      tags:
      - alerts
    put:
      consumes:
      - application/json
