version: "2"

sql:
  - name: postgres
    engine: postgresql
    schema:
      - internal/metering/adapters/postgres/migrations/001_init.up.sql
      - internal/metering/adapters/postgres/migrations/002_plan_limit_enforcement.up.sql
      - internal/metering/adapters/postgres/migrations/003_consumption_decisions.up.sql
      - internal/metering/adapters/postgres/migrations/004_consumption_decision_prune_runs.up.sql
      - internal/metering/adapters/postgres/migrations/005_consumption_decision_audit.up.sql
      - internal/metering/adapters/postgres/migrations/006_quota_counter_repairs.up.sql
      - internal/metering/adapters/postgres/migrations/007_reconciliation_monitoring.up.sql
      - internal/metering/adapters/postgres/migrations/008_reconciliation_notifications.up.sql
      - internal/metering/adapters/postgres/migrations/009_api_key_rotation.up.sql
      - internal/metering/adapters/postgres/migrations/010_worker_heartbeats.up.sql
      - internal/metering/adapters/postgres/migrations/011_worker_dead_letters.up.sql
    queries: internal/metering/adapters/postgres/queries
    gen:
      go:
        package: postgresdb
        out: internal/metering/adapters/postgres/postgresdb
        sql_package: database/sql
        emit_empty_slices: true
        omit_unused_structs: true

  - name: sqlite
    engine: sqlite
    schema:
      - internal/metering/adapters/sqlite/migrations/001_init.up.sql
      - internal/metering/adapters/sqlite/migrations/002_plan_limit_enforcement.up.sql
      - internal/metering/adapters/sqlite/migrations/003_consumption_decisions.up.sql
      - internal/metering/adapters/sqlite/migrations/004_consumption_decision_prune_runs.up.sql
      - internal/metering/adapters/sqlite/migrations/005_consumption_decision_audit.up.sql
      - internal/metering/adapters/sqlite/migrations/006_quota_counter_repairs.up.sql
      - internal/metering/adapters/sqlite/migrations/007_reconciliation_monitoring.up.sql
      - internal/metering/adapters/sqlite/migrations/008_reconciliation_notifications.up.sql
      - internal/metering/adapters/sqlite/migrations/009_api_key_rotation.up.sql
      - internal/metering/adapters/sqlite/migrations/010_worker_heartbeats.up.sql
      - internal/metering/adapters/sqlite/migrations/011_worker_dead_letters.up.sql
    queries: internal/metering/adapters/sqlite/queries
    gen:
      go:
        package: sqlitedb
        out: internal/metering/adapters/sqlite/sqlitedb
        sql_package: database/sql
        emit_empty_slices: true
        omit_unused_structs: true
