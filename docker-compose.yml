services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_spanner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_spanner"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - open-spanner-postgres:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - open-spanner-minio:/data

volumes:
  open-spanner-postgres:
  open-spanner-minio:
