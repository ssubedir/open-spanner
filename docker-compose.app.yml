services:
  web:
    image: open-spanner-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 18081
      OPEN_SPANNER_API_PROXY_URL: http://app:18080
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18081/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "${OPEN_SPANNER_HTTP_PORT:-18081}:18081"
    restart: unless-stopped

  app:
    image: open-spanner:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    environment:
      OPEN_SPANNER_HTTP_ADDR: :18080
      OPEN_SPANNER_GRPC_ADDR: :18090
      OPEN_SPANNER_INGESTION_MAX_BODY_BYTES: ${OPEN_SPANNER_INGESTION_MAX_BODY_BYTES:-1048576}
      OPEN_SPANNER_INGESTION_MAX_BULK_EVENTS: ${OPEN_SPANNER_INGESTION_MAX_BULK_EVENTS:-1000}
      OPEN_SPANNER_INGESTION_MAX_STREAM_EVENTS: ${OPEN_SPANNER_INGESTION_MAX_STREAM_EVENTS:-1000}
      OPEN_SPANNER_INGESTION_RATE_LIMIT_EVENTS: ${OPEN_SPANNER_INGESTION_RATE_LIMIT_EVENTS:-10000}
      OPEN_SPANNER_INGESTION_RATE_LIMIT_WINDOW: ${OPEN_SPANNER_INGESTION_RATE_LIMIT_WINDOW:-1m}
      OPEN_SPANNER_REGISTRATION_ENABLED: ${OPEN_SPANNER_REGISTRATION_ENABLED:-true}
      OPEN_SPANNER_DB_DRIVER: postgres
      OPEN_SPANNER_POSTGRES_DSN: postgres://open_spanner:${OPEN_SPANNER_POSTGRES_PASSWORD:-open_spanner}@postgres:5432/open_spanner?sslmode=disable
      OPEN_SPANNER_DB_MAX_OPEN_CONNS: ${OPEN_SPANNER_API_DB_MAX_OPEN_CONNS:-20}
      OPEN_SPANNER_DB_MAX_IDLE_CONNS: ${OPEN_SPANNER_API_DB_MAX_IDLE_CONNS:-10}
      OPEN_SPANNER_DB_CONN_MAX_LIFETIME: ${OPEN_SPANNER_DB_CONN_MAX_LIFETIME:-30m}
      OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME: ${OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME:-5m}
      OPEN_SPANNER_EXPORT_STORAGE_PATH: /data/exports
      OPEN_SPANNER_EXPORT_STORAGE_DRIVER: ${OPEN_SPANNER_EXPORT_STORAGE_DRIVER:-filesystem}
      OPEN_SPANNER_EXPORT_S3_BUCKET: ${OPEN_SPANNER_EXPORT_S3_BUCKET:-}
      OPEN_SPANNER_EXPORT_S3_REGION: ${OPEN_SPANNER_EXPORT_S3_REGION:-us-east-1}
      OPEN_SPANNER_EXPORT_S3_ENDPOINT: ${OPEN_SPANNER_EXPORT_S3_ENDPOINT:-}
      OPEN_SPANNER_EXPORT_S3_ACCESS_KEY_ID: ${OPEN_SPANNER_EXPORT_S3_ACCESS_KEY_ID:-}
      OPEN_SPANNER_EXPORT_S3_SECRET_ACCESS_KEY: ${OPEN_SPANNER_EXPORT_S3_SECRET_ACCESS_KEY:-}
      OPEN_SPANNER_EXPORT_S3_SESSION_TOKEN: ${OPEN_SPANNER_EXPORT_S3_SESSION_TOKEN:-}
      OPEN_SPANNER_EXPORT_S3_PREFIX: ${OPEN_SPANNER_EXPORT_S3_PREFIX:-}
      OPEN_SPANNER_EXPORT_S3_FORCE_PATH_STYLE: ${OPEN_SPANNER_EXPORT_S3_FORCE_PATH_STYLE:-}
      OPEN_SPANNER_RETENTION_PRUNE_ENABLED: ${OPEN_SPANNER_RETENTION_PRUNE_ENABLED:-false}
      OPEN_SPANNER_CONSUMPTION_DECISION_RETENTION: ${OPEN_SPANNER_CONSUMPTION_DECISION_RETENTION:-720h}
      OPEN_SPANNER_OPERATIONAL_HISTORY_RETENTION: ${OPEN_SPANNER_OPERATIONAL_HISTORY_RETENTION:-720h}
      OPEN_SPANNER_OPERATIONAL_HISTORY_INTERVAL: ${OPEN_SPANNER_OPERATIONAL_HISTORY_INTERVAL:-1h}
      OPEN_SPANNER_OPERATIONAL_HISTORY_TIMEOUT: ${OPEN_SPANNER_OPERATIONAL_HISTORY_TIMEOUT:-5m}
      OPEN_SPANNER_OPERATIONAL_HISTORY_BATCH_SIZE: ${OPEN_SPANNER_OPERATIONAL_HISTORY_BATCH_SIZE:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - open-spanner-app-exports:/data/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "${OPEN_SPANNER_GRPC_PORT:-18090}:18090"
    expose:
      - "18080"
    restart: unless-stopped

  export-worker:
    image: open-spanner:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    entrypoint: ["/usr/local/bin/open-spanner-export-worker"]
    environment:
      OPEN_SPANNER_DB_DRIVER: postgres
      OPEN_SPANNER_POSTGRES_DSN: postgres://open_spanner:${OPEN_SPANNER_POSTGRES_PASSWORD:-open_spanner}@postgres:5432/open_spanner?sslmode=disable
      OPEN_SPANNER_DB_MAX_OPEN_CONNS: ${OPEN_SPANNER_EXPORT_DB_MAX_OPEN_CONNS:-5}
      OPEN_SPANNER_DB_MAX_IDLE_CONNS: ${OPEN_SPANNER_EXPORT_DB_MAX_IDLE_CONNS:-2}
      OPEN_SPANNER_DB_CONN_MAX_LIFETIME: ${OPEN_SPANNER_DB_CONN_MAX_LIFETIME:-30m}
      OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME: ${OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME:-5m}
      OPEN_SPANNER_EXPORT_STORAGE_PATH: /data/exports
      OPEN_SPANNER_EXPORT_STORAGE_DRIVER: ${OPEN_SPANNER_EXPORT_STORAGE_DRIVER:-filesystem}
      OPEN_SPANNER_EXPORT_S3_BUCKET: ${OPEN_SPANNER_EXPORT_S3_BUCKET:-}
      OPEN_SPANNER_EXPORT_S3_REGION: ${OPEN_SPANNER_EXPORT_S3_REGION:-us-east-1}
      OPEN_SPANNER_EXPORT_S3_ENDPOINT: ${OPEN_SPANNER_EXPORT_S3_ENDPOINT:-}
      OPEN_SPANNER_EXPORT_S3_ACCESS_KEY_ID: ${OPEN_SPANNER_EXPORT_S3_ACCESS_KEY_ID:-}
      OPEN_SPANNER_EXPORT_S3_SECRET_ACCESS_KEY: ${OPEN_SPANNER_EXPORT_S3_SECRET_ACCESS_KEY:-}
      OPEN_SPANNER_EXPORT_S3_SESSION_TOKEN: ${OPEN_SPANNER_EXPORT_S3_SESSION_TOKEN:-}
      OPEN_SPANNER_EXPORT_S3_PREFIX: ${OPEN_SPANNER_EXPORT_S3_PREFIX:-}
      OPEN_SPANNER_EXPORT_S3_FORCE_PATH_STYLE: ${OPEN_SPANNER_EXPORT_S3_FORCE_PATH_STYLE:-}
      OPEN_SPANNER_EXPORT_WORKER_INTERVAL: ${OPEN_SPANNER_EXPORT_WORKER_INTERVAL:-5s}
      OPEN_SPANNER_EXPORT_WORKER_HEALTH_ADDR: :18082
      OPEN_SPANNER_EXPORT_WORKER_LOCK_TTL: ${OPEN_SPANNER_EXPORT_WORKER_LOCK_TTL:-5m}
      OPEN_SPANNER_EXPORT_WORKER_MAX_ATTEMPTS: ${OPEN_SPANNER_EXPORT_WORKER_MAX_ATTEMPTS:-3}
      OPEN_SPANNER_EXPORT_RETENTION: ${OPEN_SPANNER_EXPORT_RETENTION:-168h}
      OPEN_SPANNER_EXPORT_CLEANUP_INTERVAL: ${OPEN_SPANNER_EXPORT_CLEANUP_INTERVAL:-1h}
      OPEN_SPANNER_EXPORT_CLEANUP_BATCH_SIZE: ${OPEN_SPANNER_EXPORT_CLEANUP_BATCH_SIZE:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - open-spanner-app-exports:/data/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18082/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  alert-worker:
    image: open-spanner:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    entrypoint: ["/usr/local/bin/open-spanner-alert-worker"]
    environment:
      OPEN_SPANNER_DB_DRIVER: postgres
      OPEN_SPANNER_POSTGRES_DSN: postgres://open_spanner:${OPEN_SPANNER_POSTGRES_PASSWORD:-open_spanner}@postgres:5432/open_spanner?sslmode=disable
      OPEN_SPANNER_DB_MAX_OPEN_CONNS: ${OPEN_SPANNER_ALERT_DB_MAX_OPEN_CONNS:-5}
      OPEN_SPANNER_DB_MAX_IDLE_CONNS: ${OPEN_SPANNER_ALERT_DB_MAX_IDLE_CONNS:-2}
      OPEN_SPANNER_DB_CONN_MAX_LIFETIME: ${OPEN_SPANNER_DB_CONN_MAX_LIFETIME:-30m}
      OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME: ${OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME:-5m}
      OPEN_SPANNER_ALERT_WORKER_INTERVAL: ${OPEN_SPANNER_ALERT_WORKER_INTERVAL:-5s}
      OPEN_SPANNER_ALERT_WORKER_HEALTH_ADDR: :18083
      OPEN_SPANNER_ALERT_WORKER_LOCK_TTL: ${OPEN_SPANNER_ALERT_WORKER_LOCK_TTL:-5m}
      OPEN_SPANNER_ALERT_WORKER_TIMEOUT: ${OPEN_SPANNER_ALERT_WORKER_TIMEOUT:-1m}
      OPEN_SPANNER_ALERT_WORKER_RETRY_AFTER: ${OPEN_SPANNER_ALERT_WORKER_RETRY_AFTER:-30s}
      OPEN_SPANNER_ALERT_WORKER_MAX_ATTEMPTS: ${OPEN_SPANNER_ALERT_WORKER_MAX_ATTEMPTS:-3}
      OPEN_SPANNER_ALERT_WORKER_BATCH_SIZE: ${OPEN_SPANNER_ALERT_WORKER_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18083/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  entitlement-worker:
    image: open-spanner:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    entrypoint: ["/usr/local/bin/open-spanner-entitlement-worker"]
    environment:
      OPEN_SPANNER_DB_DRIVER: postgres
      OPEN_SPANNER_POSTGRES_DSN: postgres://open_spanner:${OPEN_SPANNER_POSTGRES_PASSWORD:-open_spanner}@postgres:5432/open_spanner?sslmode=disable
      OPEN_SPANNER_DB_MAX_OPEN_CONNS: ${OPEN_SPANNER_ENTITLEMENT_DB_MAX_OPEN_CONNS:-5}
      OPEN_SPANNER_DB_MAX_IDLE_CONNS: ${OPEN_SPANNER_ENTITLEMENT_DB_MAX_IDLE_CONNS:-2}
      OPEN_SPANNER_DB_CONN_MAX_LIFETIME: ${OPEN_SPANNER_DB_CONN_MAX_LIFETIME:-30m}
      OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME: ${OPEN_SPANNER_DB_CONN_MAX_IDLE_TIME:-5m}
      OPEN_SPANNER_ENTITLEMENT_WORKER_INTERVAL: ${OPEN_SPANNER_ENTITLEMENT_WORKER_INTERVAL:-5s}
      OPEN_SPANNER_ENTITLEMENT_WORKER_HEALTH_ADDR: :18084
      OPEN_SPANNER_ENTITLEMENT_WORKER_LOCK_TTL: ${OPEN_SPANNER_ENTITLEMENT_WORKER_LOCK_TTL:-5m}
      OPEN_SPANNER_ENTITLEMENT_WORKER_TIMEOUT: ${OPEN_SPANNER_ENTITLEMENT_WORKER_TIMEOUT:-1m}
      OPEN_SPANNER_ENTITLEMENT_WORKER_RETRY_AFTER: ${OPEN_SPANNER_ENTITLEMENT_WORKER_RETRY_AFTER:-30s}
      OPEN_SPANNER_ENTITLEMENT_WORKER_MAX_ATTEMPTS: ${OPEN_SPANNER_ENTITLEMENT_WORKER_MAX_ATTEMPTS:-3}
      OPEN_SPANNER_ENTITLEMENT_WORKER_BATCH_SIZE: ${OPEN_SPANNER_ENTITLEMENT_WORKER_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18084/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: open_spanner
      POSTGRES_PASSWORD: ${OPEN_SPANNER_POSTGRES_PASSWORD:-open_spanner}
      POSTGRES_DB: open_spanner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_spanner -d open_spanner"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - open-spanner-app-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  open-spanner-app-postgres:
  open-spanner-app-exports:
