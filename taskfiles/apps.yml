version: '3'

tasks:
  control-plane:dev:
    desc: Run the Next.js control plane dev server
    env:
      OPEN_SPANNER_API_PROXY_URL: http://127.0.0.1:18080
    cmds:
      - cd web; npm run dev -- --hostname 127.0.0.1 --port 18081

  control-plane:build:
    desc: Build the standalone Next.js control plane
    cmds:
      - cd web; npm run build

  docs:dev:
    desc: Run the Fumadocs documentation site dev server
    cmds:
      - cd docs; npm run dev

  docs:build:
    desc: Build the Fumadocs documentation site
    cmds:
      - cd docs; npm run build
